<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Left wing (drawn first so fuselage overlaps the root) -->
  <polygon points="55,50 52,62 8,86 10,92 46,96 60,84 55,68"
    fill="#0D0D0F" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right wing -->
  <polygon points="73,50 76,62 120,86 118,92 82,96 68,84 73,68"
    fill="#0D0D0F" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Main fuselage -->
  <polygon points="64,8 69,26 73,50 68,80 64,88 60,80 55,50 59,26"
    fill="#0D0D0F" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Single central engine pod -->
  <ellipse cx="64" cy="98" rx="10" ry="14"
    fill="#0D0D0F" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Engine exhaust glow hint -->
  <ellipse cx="64" cy="105" rx="4" ry="4"
    fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Cockpit canopy (dark panel near nose) -->
  <polygon points="64,16 67,22 67,40 64,44 61,40 61,22"
    fill="#080810" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Central hull spine accent -->
  <line x1="64" y1="48" x2="64" y2="78"
    stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>
</svg>
